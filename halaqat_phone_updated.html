<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b4d">
<title>حلقات التحفيظ — نسخة الهاتف</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:#f5f7f6;color:#17201c}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:#e8eeeb;color:#17352a}
button.primary{background:#176b4d;color:white}.danger{background:#fee2e2!important;color:#991b1b!important}.muted{color:#68756f}.small{font-size:.88rem}
header{background:#176b4d;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px #0002}
header h1{font-size:20px;margin:0 0 5px}header p{margin:0;opacity:.88;font-size:13px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.top button{background:#ffffff20;color:#fff}
nav{display:flex;gap:7px;overflow:auto;padding:9px;background:#fff;border-bottom:1px solid #dde5e0;position:sticky;top:78px;z-index:9}
nav button{white-space:nowrap;padding:9px 12px;font-size:13px}nav button.active{background:#176b4d;color:#fff}
main{max-width:1100px;margin:auto;padding:14px 12px 70px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:#fff;border:1px solid #e1e8e4;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}
.stat{font-size:26px;font-weight:800;margin-top:3px}.hero{background:linear-gradient(135deg,#e8f5ef,#fff)}
h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:12px 0 8px}
.form{display:grid;gap:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
input,select,textarea{width:100%;border:1px solid #ccd8d2;background:#fff;border-radius:11px;padding:11px;outline:none}textarea{min-height:80px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap}.list{display:grid;gap:8px}.item{border:1px solid #e1e8e4;border-radius:12px;padding:11px;background:#fbfcfb}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eaf3ee;color:#176b4d;font-size:12px}.ok{color:#176b4d;font-weight:700}.err{color:#a33;font-size:13px}
table{width:100%;border-collapse:collapse}th,td{padding:9px 7px;border-bottom:1px solid #e7ece9;text-align:right;font-size:13px}th{background:#f6f9f7}
.tablewrap{overflow:auto}.quran{font-family:"Amiri","Noto Naskh Arabic",serif;font-size:23px;line-height:2.1;background:#fffdf5;border:2px solid #d9c99a;border-radius:15px;padding:18px}
.toast{position:fixed;bottom:18px;left:18px;right:18px;z-index:30;background:#17352a;color:#fff;padding:13px;border-radius:13px;display:none}
.empty{padding:22px;text-align:center;color:#718078}
@media(max-width:700px){.two,.three{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr)}nav{top:76px}.stat{font-size:22px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1>نظام حلقات تحفيظ القرآن</h1><p>نسخة الهاتف — تعمل محليًا بدون خادم أو Docker</p></div>
    <button onclick="resetDemo()">بيانات تجريبية</button>
  </div>
</header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="toast" class="toast"></div>

<script>
const KEY="halaqat_phone_v2";
const planOptions=["حفظ جديد","مراجعة","حفظ ومراجعة","سرد تراكمي"];
const portions=["ربع وجه","نصف وجه","وجه","ربعين","حزب","جزء"];
const attendance=["حاضر","غائب","غياب بعذر","متأخر"];
const testTypes=["أسبوعي","شهري","تراكمي","نوع آخر"];
const views=[
 ["home","الرئيسية"],["circles","الحلقات"],["students","الطلاب"],["plans","خطة الطالب"],
 ["records","المتابعة"],["quran","المصحف"],["tests","الاختبارات"],["finance","المالية"],
 ["meetings","اللقاءات"],["schedule","الجدول الزمني"],["audio","التسجيلات"],["telegram","Telegram"],["settings","الإعدادات"]
];
let state=load();
let current="home";

function blank(){return {circles:[],students:[],records:[],tests:[],ledger:[],meetings:[],schedules:[],warnings:[],audios:[],googleTests:[],settings:{telegramReady:false,cloudReady:false,notifications:false,teacherNotify:true,supervisorNotify:true,studentNotify:true,audioAutoSend:true,googleTestsAuto:true,googleSource:'',googleSync:'مزامنة تلقائية من الخادم'},seq:{circle:1,student:1,record:1,test:1,ledger:1,meeting:1,schedule:1,warning:1,audio:1,googleTest:1}}}
function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){return blank()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function id(k){return state.seq[k]++}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2200)}
function nav(){document.getElementById("nav").innerHTML=views.map(v=>`<button class="${current===v[0]?'active':''}" onclick="go('${v[0]}')">${v[1]}</button>`).join("")}
function go(v){current=v;nav();({home, circles, students, plans, records, quran, tests, finance, meetings, schedule, audio, telegram, settings}[v])()}
function circleName(id){return state.circles.find(x=>x.id==id)?.name||"بدون حلقة"}
function studentName(id){return state.students.find(x=>x.id==id)?.name||"—"}
function selectStudents(id="student_id"){return `<select id="${id}">${state.students.map(s=>`<option value="${s.id}">${esc(s.name)} — ${esc(s.number||"")}</option>`).join("")}</select>`}
function selectCircles(id="circle_id"){return `<select id="${id}"><option value="">بدون حلقة</option>${state.circles.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>`}
function stat(t,v){return `<div class="card"><div class="muted">${t}</div><div class="stat">${v}</div></div>`}

function home(){
 const group=state.circles.filter(x=>x.type==="جماعية").length;
 const upcoming=state.meetings.filter(x=>new Date(x.at)>=new Date()).length;
 document.getElementById("app").innerHTML=`
 <div class="grid">${stat("الحلقات",state.circles.length)}${stat("الطلاب",state.students.length)}${stat("الجماعية",group)}${stat("اللقاءات القادمة",upcoming)}</div>
 <div class="card hero"><h2>جاهز للعمل على الهاتف</h2>
 <p>هذه النسخة تحفظ بياناتك داخل الهاتف باستخدام التخزين المحلي. لا تحتاج إلى كمبيوتر أو Docker أو Android Studio.</p>
 <div class="actions"><button class="primary" onclick="go('students')">إضافة طالب</button><button onclick="go('circles')">إضافة حلقة</button><button onclick="go('records')">متابعة اليوم</button><button onclick="go('schedule')">الجدول والمنبهات</button><button onclick="go('audio')">التسجيلات</button><button onclick="go('tests')">اختبارات Google</button></div></div>
 <div class="card"><h3>حالة المزامنة</h3><p>الخادم السحابي: <b>${state.settings.cloudReady?"متصل":"غير مضاف بعد"}</b></p><p>Telegram: <b>${state.settings.telegramReady?"مفعل":"سيتم ربطه بعد إضافة الخادم"}</b></p>
 <p class="small muted">بيانات النسخة المحلية لا تُرسل لأي جهة. عند الانتقال للخادم سنضيف مزامنة آمنة وTelegram.</p></div>`;
}

function circles(){
 document.getElementById("app").innerHTML=`
 <div class="card"><h2>إضافة حلقة</h2><div class="form">
 <input id="cname" placeholder="اسم الحلقة"><input id="teacher" placeholder="اسم المعلمة / المشرفة">
 <div class="two"><select id="ctype"><option>جماعية</option><option>فردية</option></select><input id="chat" placeholder="Telegram Chat ID (للحلقة الجماعية)"></div>
 <input id="link" placeholder="رابط Zoom أو Teams">
 <div class="card" style="margin:8px 0"><b>الجدول الأسبوعي</b><p class="small muted">حددي الأيام، ووقت البداية والنهاية لكل يوم.</p>${weekDays.map(d=>`<div class="two" style="align-items:center"><label><input type="checkbox" id="day_${d.key}"> ${d.name}</label><span><input id="start_${d.key}" type="time" value="19:00"> إلى <input id="end_${d.key}" type="time" value="20:00"></span></div>`).join("")}</div>
 <div class="card" style="margin:8px 0"><b>منبهات الحلقة</b><p class="small muted">حددي قبل الموعد بكم دقيقة يصل التنبيه لكل فئة.</p>
 <div class="three"><input id="teacherReminder" type="number" value="30" min="0" placeholder="المعلمة: دقائق"><input id="supervisorReminder" type="number" value="45" min="0" placeholder="المشرفة: دقائق"><input id="studentReminder" type="number" value="30" min="0" placeholder="الطلاب: دقائق"></div></div>
 <button class="primary" onclick="addCircle()">حفظ الحلقة</button></div></div>
 <div class="card"><h2>الحلقات</h2><div class="list">${state.circles.length?state.circles.map(c=>`
 <div class="item"><b>${esc(c.name)}</b> <span class="badge">${esc(c.type)}</span><br>
 المعلمة: ${esc(c.teacher)}<br>الجدول: ${esc(scheduleText(c))}<br>
 <span class="small">Telegram: ${esc(c.chat||"غير مضبوط")} — الرابط: ${esc(c.link||"غير مضبوط")} — تنبيه: قبل ${esc(c.reminder||30)} دقيقة</span></div>`).join(""):'<div class="empty">لا توجد حلقات بعد</div>'}</div></div>`;
}
const weekDays=[{key:"sat",name:"السبت"},{key:"sun",name:"الأحد"},{key:"mon",name:"الاثنين"},{key:"tue",name:"الثلاثاء"},{key:"wed",name:"الأربعاء"},{key:"thu",name:"الخميس"},{key:"fri",name:"الجمعة"}];
function getWeeklyFromForm(){return weekDays.filter(d=>document.getElementById("day_"+d.key)?.checked).map(d=>({day:d.key,name:d.name,start:val("start_"+d.key),end:val("end_"+d.key)}))}
function scheduleText(c){return (c.weekly||[]).map(x=>`${x.name} ${x.start}-${x.end}`).join("، ")||"لم يحدد"}
function addCircle(){
 let weekly=getWeeklyFromForm();
 let teacherReminder=+val("teacherReminder")||0, supervisorReminder=+val("supervisorReminder")||0, studentReminder=+val("studentReminder")||0;
 let c={id:id("circle"),name:val("cname"),teacher:val("teacher"),type:val("ctype"),chat:val("chat"),link:val("link"),weekly,days:weekly.map(x=>x.name).join("، "),time:weekly[0]?.start||"",reminder:teacherReminder,reminders:{teacher:teacherReminder,supervisor:supervisorReminder,student:studentReminder}};
 if(!c.name){toast("اكتب اسم الحلقة");return}if(!weekly.length){toast("حدد يومًا واحدًا على الأقل");return}state.circles.push(c);save();toast("تم حفظ الحلقة بالجدول الأسبوعي والمنبهات");go("schedule")
}
function durationMinutes(start,end){if(!start||!end)return 0;let [sh,sm]=start.split(':').map(Number),[eh,em]=end.split(':').map(Number);let a=sh*60+sm,b=eh*60+em;if(b<a)b+=1440;return b-a}
function durationText(min){if(!min)return "—";let h=Math.floor(min/60),m=min%60;return h?`${h} س${m?` و ${m} د`:''}`:`${m} دقيقة`}

function schedule(){
 let rows=state.circles.flatMap(c=>(c.weekly||[]).map(x=>({c,x})));
 document.getElementById("app").innerHTML=`<div class="card"><h2>الجدول الزمني للحلقات</h2><p class="small muted">حددي بداية ونهاية كل لقاء، وسيحسب النظام مدة الحلقة تلقائيًا ويعرضها على مدار الأسبوع.</p><div class="tablewrap"><table><thead><tr><th>اليوم</th><th>الحلقة</th><th>من</th><th>إلى</th><th>المدة</th><th>المنبهات</th></tr></thead><tbody>${rows.map(r=>{let rr=r.c.reminders||{teacher:r.c.reminder||30,supervisor:r.c.reminder||30,student:r.c.reminder||30};return `<tr><td>${esc(r.x.name)}</td><td>${esc(r.c.name)}</td><td>${esc(r.x.start)}</td><td>${esc(r.x.end)}</td><td>${durationText(durationMinutes(r.x.start,r.x.end))}</td><td>معلمة ${rr.teacher||0}د / مشرفة ${rr.supervisor||0}د / طالب ${rr.student||0}د</td>`}).join("")||'<tr><td colspan="6">لا يوجد جدول بعد</td></tr>'}</tbody></table></div></div>
 <div class="card"><h2>منبهات المعلمة والمشرفة والطلاب</h2><p>فعّلي إشعارات الهاتف، ثم اختاري الفئات التي تحتاج تنبيهًا. الإشعار المحلي يعمل على الجهاز المفتوح، أما التنبيه حتى مع إغلاق التطبيق فيحتاج الخادم السحابي.</p><div class="actions"><button class="primary" onclick="enableNotifications()">تفعيل إشعارات الهاتف</button><label><input type="checkbox" ${state.settings.teacherNotify!==false?'checked':''} onchange="state.settings.teacherNotify=this.checked;save()"> المعلمة</label><label><input type="checkbox" ${state.settings.supervisorNotify!==false?'checked':''} onchange="state.settings.supervisorNotify=this.checked;save()"> المشرفة</label><label><input type="checkbox" ${state.settings.studentNotify!==false?'checked':''} onchange="state.settings.studentNotify=this.checked;save()"> الطالب</label></div></div>
 <div class="card"><h3>ما سيتم تشغيله من الخادم</h3><div class="list"><div class="item">تنبيه المعلمة قبل الموعد حسب إعداد الحلقة.</div><div class="item">تنبيه المشرفة قبل الموعد حسب إعداد الحلقة.</div><div class="item">تنبيه الطالب قبل الموعد حسب إعداد الحلقة.</div><div class="item">منع تكرار التنبيه لنفس اللقاء.</div></div></div>`;
}

async function enableNotifications(){if(!('Notification' in window)){toast('هذا المتصفح لا يدعم إشعارات الهاتف');return}let p=await Notification.requestPermission();state.settings.notifications=p==='granted';save();toast(p==='granted'?'تم تفعيل الإشعارات':'لم يتم السماح بالإشعارات')}
function nextReminderItems(){let now=new Date(),items=[];state.circles.forEach(c=>(c.weekly||[]).forEach(x=>{let dayMap={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};let target=new Date(now);let delta=(dayMap[x.day]-now.getDay()+7)%7;target.setDate(now.getDate()+delta);let [hh,mm]=(x.start||'00:00').split(':').map(Number);target.setHours(hh,mm,0,0);if(target<=now)target.setDate(target.getDate()+7);items.push({c,x,target})}));return items}
function checkLocalReminders(){if(!state.settings.notifications||Notification.permission!=='granted')return;let now=Date.now();nextReminderItems().forEach(i=>{let rr=i.c.reminders||{teacher:i.c.reminder||30,supervisor:i.c.reminder||30,student:i.c.reminder||30};[['teacher','المعلمة',state.settings.teacherNotify!==false],['supervisor','المشرفة',state.settings.supervisorNotify!==false],['student','الطالب',state.settings.studentNotify!==false]].forEach(([role,label,enabled])=>{if(!enabled)return;let diff=i.target.getTime()-now,rem=(rr[role]||0)*60000;if(rem<=0||diff<=0||Math.abs(diff-rem)>30000)return;let key=`${i.c.id}-${i.x.day}-${i.target.toISOString().slice(0,10)}-${role}`;if(localStorage.getItem('rem_'+key)!=='1'){new Notification(`تذكير ${label}: ${i.c.name}`,{body:`تبدأ الحلقة ${i.x.name} الساعة ${i.x.start} وتستمر ${durationText(durationMinutes(i.x.start,i.x.end))}. ${i.c.link||''}`});localStorage.setItem('rem_'+key,'1')}})})}

setInterval(checkLocalReminders,30000);

function students(){
 document.getElementById("app").innerHTML=`
 <div class="card"><h2>إضافة طالب</h2><div class="form">
 <div class="two"><input id="sname" placeholder="اسم الطالب"><input id="snum" placeholder="رقم الطالب"></div><div class="two"><input id="stelegram" placeholder="Telegram Chat ID للطالب (اختياري)"><input id="sphone" placeholder="هاتف الطالب (اختياري)"></div>
 <div class="two">${selectCircles("scircle")}<input id="steacher" placeholder="المعلمة"></div>
 <div class="two"><input id="companion" placeholder="الرفيق (اختياري)"><select id="splan">${planOptions.map(x=>`<option>${x}</option>`).join("")}</select></div>
 <div class="two"><select id="portion">${portions.map(x=>`<option>${x}</option>`).join("")}</select><input id="lastPage" type="number" min="1" max="604" step=".25" placeholder="آخر موضع (صفحة)"></div>
 <div class="three"><select id="newP"><option>ربع وجه</option>${portions.slice(1).map(x=>`<option>${x}</option>`).join("")}</select>
 <select id="repeatP">${portions.map(x=>`<option>${x}</option>`).join("")}</select><select id="masteryP">${portions.map(x=>`<option>${x}</option>`).join("")}</select></div>
 <button class="primary" onclick="addStudent()">حفظ الطالب</button></div></div>
 <div class="card"><h2>الطلاب</h2><div class="tablewrap"><table><thead><tr><th>الاسم</th><th>الحلقة</th><th>الخطة</th><th>المقدار</th><th>آخر موضع</th><th>الرصيد</th></tr></thead><tbody>
 ${state.students.length?state.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(circleName(s.circleId))}</td><td>${esc(s.plan)}</td><td>${esc(s.portion)}</td><td>${s.lastPage||"—"}</td><td>${balance(s.id).toFixed(2)}</td></tr>`).join(""):'<tr><td colspan="6" class="empty">لا يوجد طلاب</td></tr>'}</tbody></table></div></div>`;
}
function addStudent(){
 let s={id:id("student"),name:val("sname"),number:val("snum"),telegram:val("stelegram"),phone:val("sphone"),circleId:+val("scircle")||null,teacher:val("steacher"),companion:val("companion"),plan:val("splan"),portion:val("portion"),newP:val("newP"),repeatP:val("repeatP"),masteryP:val("masteryP"),lastPage:+val("lastPage")||1};
 if(!s.name){toast("اكتب اسم الطالب");return}state.students.push(s);save();toast("تم حفظ الطالب");go("students")
}

function portionPages(p){
 return {"ربع وجه":.25,"نصف وجه":.5,"وجه":1,"ربعين":.5,"حزب":10,"جزء":20}[p]||1;
}
function nextPage(s,kind){
 let start=Math.max(1,Number(s.lastPage)||1), size=portionPages(kind==="new"?s.newP:kind==="review"?s.repeatP:s.portion);
 if(kind==="cumulative") return {from:1,to:Math.min(604,Math.max(1,start+20))};
 return {from:start,to:Math.min(604,start+size)};
}
function plans(){
 if(!state.students.length){document.getElementById("app").innerHTML='<div class="card empty">أضف طالبًا أولًا.</div>';return}
 document.getElementById("app").innerHTML=`
 <div class="card"><h2>خطة الطالب والورد التالي</h2><div class="form">${selectStudents("pstudent")}<button class="primary" onclick="showPlan()">عرض الورد التالي</button></div><div id="planResult"></div></div>`;
}
function showPlan(){
 let s=state.students.find(x=>x.id==+val("pstudent")); if(!s)return;
 let n=nextPage(s,"new"),r=nextPage(s,"review"),c=nextPage(s,"cumulative");
 document.getElementById("planResult").innerHTML=`<div class="card"><h3>${esc(s.name)}</h3>
 <p>الخطة: <b>${esc(s.plan)}</b> — المقدار: <b>${esc(s.portion)}</b> — آخر صفحة: <b>${s.lastPage}</b></p>
 <div class="three"><div class="item"><b>ورد جديد</b><br>صفحة ${n.from} → ${n.to}</div><div class="item"><b>ورد التكرار</b><br>صفحة ${r.from} → ${r.to}</div><div class="item"><b>السرد التراكمي</b><br>صفحة ${c.from} → ${c.to}</div></div>
 <p class="small muted">هذا حساب محلي للمقدار. عند إضافة الخادم سنربطه ببيانات المصحف الموثوقة لإعطاء الموضع الدقيق بالآيات.</p></div>`;
}

function records(){
 if(!state.students.length){document.getElementById("app").innerHTML='<div class="card empty">أضف طالبًا أولًا.</div>';return}
 document.getElementById("app").innerHTML=`
 <div class="card"><h2>المتابعة اليومية</h2><div class="form">${selectStudents("rstudent")}
 <input id="rdate" type="date" value="${new Date().toISOString().slice(0,10)}"><select id="att">${attendance.map(x=>`<option>${x}</option>`).join("")}</select>
 <select id="complete"><option>تم</option><option>لم يتم</option></select><select id="recite"><option>تم</option><option>جزئي</option><option>لم يتم</option></select>
 <input id="amount" placeholder="مقدار ما حفظه أو راجعه"><textarea id="notes" placeholder="ملاحظات"></textarea><button class="primary" onclick="saveRecord()">حفظ المتابعة</button></div></div>
 <div class="card"><h2>آخر المتابعات</h2><div class="list">${state.records.slice().reverse().slice(0,15).map(r=>`<div class="item"><b>${esc(studentName(r.studentId))}</b> — ${esc(r.date)}<br>${esc(r.att)} — تمام: ${esc(r.complete)} — سرد: ${esc(r.recite)}<br><span class="small">${esc(r.amount||"")} ${esc(r.notes||"")}</span></div>`).join("")||'<div class="empty">لا توجد متابعة</div>'}</div></div>
 <div class="card"><h2>إنذارات الغياب</h2><div class="list">${state.warnings.slice().reverse().map(w=>`<div class="item"><b>${esc(studentName(w.studentId))}</b> — ${esc(w.month)}<br><span class="err">${esc(w.message)}</span><br><span class="small">${w.sent?'تم إرسال التنبيه عبر الخادم':'جاهز للإرسال عبر Telegram عند ربط الخادم'}</span></div>`).join("")||'<div class="empty">لا توجد إنذارات</div>'}</div></div>`;
}
function monthAbsenceCount(studentId,month){return state.records.filter(r=>r.studentId==studentId&&r.att==='غائب'&&String(r.date||'').slice(0,7)===month).length}
function createAbsenceWarning(studentId,month){
 let s=state.students.find(x=>x.id==studentId), c=s&&state.circles.find(x=>x.id==s.circleId);if(!s||!c)return null;
 let existing=state.warnings.find(w=>w.studentId==studentId&&w.month===month&&w.reason==='3 غيابات في الشهر');
 if(existing)return existing;
 let w={id:id('warning'),studentId,month,reason:'3 غيابات في الشهر',message:`إنذار: تم تسجيل 3 غيابات للطالب ${s.name} خلال شهر ${month}. وفق إعداد النظام يتم تنبيهه بقرب الحذف من الحلقة.`,createdAt:new Date().toISOString(),sent:false};state.warnings.push(w);return w
}
function saveRecord(){
 let studentId=+val("rstudent"),date=val("rdate"),att=val("att");
 state.records.push({id:id("record"),studentId,date,att,complete:val("complete"),recite:val("recite"),amount:val("amount"),notes:val("notes")});
 let warning=null;if(att==='غائب'){let month=String(date).slice(0,7);if(monthAbsenceCount(studentId,month)>=3)warning=createAbsenceWarning(studentId,month)}
 save();toast(warning?'تم حفظ الغياب وإصدار إنذار الحذف بعد 3 غيابات هذا الشهر':'تم حفظ المتابعة');go("records")
}

function quran(){
 document.getElementById("app").innerHTML=`
 <div class="card"><h2>المصحف والورد التلقائي</h2><p>يمكنك اختيار طالب والحصول على الموضع التالي. النسخة المحلية لا تحتاج مفتاح API.</p>
 ${state.students.length?`<div class="form">${selectStudents("qstudent")}<button class="primary" onclick="qNext()">اقتراح الورد</button></div>`:'<div class="empty">أضف طالبًا أولًا</div>'}<div id="qresult"></div></div>
 <div class="card"><h3>صفحات المصحف</h3><p class="small muted">المصحف الكامل والربط الموثوق سيكونان من الخادم في المرحلة التالية؛ هنا نحافظ على النسخة التي تعمل مباشرة دون إنترنت/خادم.</p></div>`;
}
function qNext(){
 let s=state.students.find(x=>x.id==+val("qstudent"));if(!s)return;
 let n=nextPage(s,"new"),r=nextPage(s,"review"),c=nextPage(s,"cumulative");
 document.getElementById("qresult").innerHTML=`<div class="quran"><div>الطالب: <b>${esc(s.name)}</b></div><div>حفظ جديد: صفحة ${n.from}–${n.to}</div><div>مراجعة: صفحة ${r.from}–${r.to}</div><div>سرد تراكمي: صفحة ${c.from}–${c.to}</div></div>`;
}

function tests(){
 if(!state.students.length){document.getElementById("app").innerHTML='<div class="card empty">أضف طالبًا أولًا.</div>';return}
 document.getElementById("app").innerHTML=`
 <div class="card"><h2>الاختبارات</h2><p class="small muted">يمكن ربط كل اختبار Google بالصفحات التي يغطيها. عند وصول الطالب إلى ورد جديد يقترح النظام الاختبار المطابق تلقائيًا.</p>
 <div class="form">${selectStudents("tstudent")}<div class="item" id="testSuggestion">اختاري طالبًا لرؤية الاختبار المقترح.</div><select id="ttype">${testTypes.map(x=>`<option>${x}</option>`).join("")}</select>
 <div class="two"><input id="score" type="number" min="0" placeholder="الدرجة"><input id="max" type="number" min="1" value="100" placeholder="الدرجة القصوى"></div>
 <input id="tdate" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="testGoogle" placeholder="رابط اختبار Google (اختياري)"><textarea id="tnote" placeholder="ملاحظات"></textarea><button class="primary" onclick="saveTest()">حفظ نتيجة الاختبار</button></div></div>
 <div class="card"><h3>مصدر اختبارات Google</h3><p class="small muted">يمكنك إضافة رابط Google Form أو Google Sheet منشور. المزامنة الفعلية للبيانات من Google إلى الخادم تتم بعد ربط الخادم والصلاحيات المناسبة.</p><div class="form"><input id="gsource" placeholder="رابط مصدر Google للاختبارات"><select id="gsync"><option>مزامنة تلقائية من الخادم</option><option>تحديث يدوي</option></select><button onclick="saveGoogleSource()">حفظ مصدر Google</button></div><p class="small">المصدر الحالي: ${esc(state.settings.googleSource||'لم يحدد')}</p></div>
 <div class="card"><h3>اختبارات Google حسب الورد</h3><div class="form"><input id="gname" placeholder="اسم الاختبار"><div class="two"><input id="gfrom" type="number" min="1" max="604" placeholder="من صفحة"><input id="gto" type="number" min="1" max="604" placeholder="إلى صفحة"></div><input id="gurl" placeholder="رابط Google Form"><select id="gtype">${testTypes.map(x=>`<option>${x}</option>`).join("")}</select><button class="primary" onclick="saveGoogleTest()">إضافة اختبار Google</button></div><div class="list" style="margin-top:10px">${state.googleTests.map(g=>`<div class="item"><b>${esc(g.name)}</b> — صفحات ${esc(g.from)} → ${esc(g.to)}<br><span class="small">${esc(g.type)} — ${esc(g.url)}</span></div>`).join('')||'<div class="empty">لم تتم إضافة اختبارات Google بعد</div>'}</div></div>
 <div class="card"><h2>الاختبار المقترح لكل طالب</h2>${state.students.map(s=>`<div class="item"><b>${esc(s.name)}</b> — ${testPercent(s.id)}% — ${googleSuggestionText(s)}</div>`).join("")}</div>`;
}
function saveGoogleSource(){let u=val('gsource');if(!u){toast('أدخل رابط مصدر Google');return}state.settings.googleSource=u;state.settings.googleSync=val('gsync');save();toast('تم حفظ مصدر اختبارات Google');go('tests')}

function googleSuggestion(s){let n=nextPage(s,'new');return state.googleTests.filter(g=>g.from<=n.to&&g.to>=n.from).sort((a,b)=>Math.abs((a.from||0)-n.from)-Math.abs((b.from||0)-n.from))[0]||null}
function googleSuggestionText(s){let g=googleSuggestion(s);return g?`اختبار مقترح: <a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.name)}</a>`:'لا يوجد اختبار مطابق بعد'}
function saveGoogleTest(){let g={id:id('googleTest'),name:val('gname'),from:+val('gfrom')||1,to:+val('gto')||1,url:val('gurl'),type:val('gtype')};if(!g.name||!g.url){toast('اكتب اسم الاختبار ورابط Google');return}if(g.to<g.from){toast('نهاية الصفحات يجب أن تكون بعد البداية');return}state.googleTests.push(g);save();toast('تمت إضافة اختبار Google');go('tests')}
function saveTest(){
 let s=state.students.find(x=>x.id==+val('tstudent')); let g=googleSuggestion(s);
 state.tests.push({id:id("test"),studentId:s.id,type:val("ttype"),score:+val("score")||0,max:+val("max")||100,date:val("tdate"),note:val("tnote"),googleUrl:val('testGoogle')||g?.url||''});save();toast("تم حفظ الاختبار");go("tests")
}

function balance(sid){
 return state.ledger.filter(x=>x.studentId==sid).reduce((z,x)=>z+(x.kind==="دفعة"||x.kind==="تسوية دائنة"?-x.amount:x.amount),0)
}
function finance(){
 if(!state.students.length){document.getElementById("app").innerHTML='<div class="card empty">أضف طالبًا أولًا.</div>';return}
 document.getElementById("app").innerHTML=`
 <div class="card"><h2>المالية</h2><div class="form">${selectStudents("fstudent")}
 <select id="fkind"><option>رسوم</option><option>دفعة</option><option>غرامة</option><option>تسوية دائنة</option></select>
 <input id="famount" type="number" min="0" step=".01" placeholder="المبلغ"><input id="fnote" placeholder="ملاحظة">
 <button class="primary" onclick="saveLedger()">حفظ الحركة</button></div></div>
 <div class="card"><h2>كشف الحساب</h2>${state.students.map(s=>`<div class="item"><b>${esc(s.name)}</b> — الرصيد: <b>${balance(s.id).toFixed(2)}</b></div>`).join("")}</div>`;
}
function saveLedger(){
 let s=state.students.find(x=>x.id==+val("fstudent")),kind=val("fkind"),amount=+val("famount")||0;
 if(kind==="غرامة" && s && !state.circles.find(c=>c.id==s.circleId && c.type==="جماعية")){toast("الغرامات للحلقات الجماعية فقط");return}
 state.ledger.push({id:id("ledger"),studentId:s.id,kind,amount,note:val("fnote")});save();toast("تم حفظ الحركة");go("finance")
}

function meetings(){
 document.getElementById("app").innerHTML=`
 <div class="card"><h2>اللقاءات</h2>${state.circles.length?`<div class="form">${selectCircles("mcircle")}<input id="mat" type="datetime-local"><button class="primary" onclick="addMeeting()">جدولة لقاء</button></div>`:'<div class="empty">أضف حلقة أولًا</div>'}</div>
 <div class="card"><h2>اللقاءات المجدولة</h2><div class="list">${state.meetings.map(m=>`<div class="item"><b>${esc(circleName(m.circleId))}</b><br>${new Date(m.at).toLocaleString("ar-EG")}<br><span class="small">${m.sent?"تم تجهيز التذكير":"بانتظار الخادم السحابي لإرسال Telegram"}</span></div>`).join("")||'<div class="empty">لا توجد لقاءات</div>'}</div></div>`;
}
function addMeeting(){
 let at=val("mat");if(!at){toast("اختر موعدًا");return}
 state.meetings.push({id:id("meeting"),circleId:+val("mcircle"),at:new Date(at).toISOString(),sent:false});save();toast("تمت جدولة اللقاء");go("meetings")
}

function audio(){
 document.getElementById("app").innerHTML=`
 <div class="card"><h2>التسجيلات الصوتية المتتابعة</h2>
 <p class="small muted">أضيفي تسجيلات التفسير من مجموعة Telegram المصدر، مثل تفسير السعدي. نربط كل تسجيل بمدى الصفحات/الموضع وترتيبه، ثم يختار الخادم التسجيلات المناسبة ويرسلها للطالب بالتتابع حسب الورد.</p>
 <div class="form">
 <input id="aname" placeholder="عنوان التسجيل — مثال: تفسير البقرة، المقطع 1">
 <div class="two"><input id="asource" placeholder="اسم المجموعة المصدر"><input id="achat" placeholder="Chat ID للمجموعة المصدر"></div>
 <div class="three"><input id="amsg" placeholder="Telegram Message ID"><input id="afrom" type="number" min="1" max="604" placeholder="من صفحة"><input id="ato" type="number" min="1" max="604" placeholder="إلى صفحة"></div>
 <div class="three"><input id="aseq" type="number" min="1" value="1" placeholder="ترتيب التسجيل"><input id="atype" value="تفسير السعدي" placeholder="نوع التفسير"><select id="asend"><option>يرسل تلقائيًا</option><option>إرسال يدوي</option></select></div>
 <input id="afile" placeholder="رابط/معرّف التسجيل إن وجد">
 <button class="primary" onclick="saveAudio()">حفظ التسجيل</button></div></div>
 <div class="card"><h3>تسلسل التسجيلات للطالب</h3>
 ${state.students.length?`<div class="form">${selectStudents("a_student")}<button class="primary" onclick="showAudioQueue()">عرض التسلسل حسب الورد</button></div><div id="audioQueue"></div>`:'<div class="empty">أضف طالبًا أولًا</div>'}</div>
 <div class="card"><h3>التسجيلات المحفوظة</h3><div class="list">${state.audios.slice().sort((a,b)=>(a.from||0)-(b.from||0)||(a.seq||0)-(b.seq||0)).map(a=>`<div class="item"><b>${esc(a.name)}</b> <span class="badge">${esc(a.type||'تفسير')}</span><br>الصفحات: ${esc(a.from||'—')} → ${esc(a.to||'—')} — الترتيب: ${esc(a.seq||1)}<br><span class="small">المصدر: ${esc(a.source||'')} — Chat: ${esc(a.chat||'')} — Message ID: ${esc(a.messageId||'')} — ${esc(a.sendMode||'يرسل تلقائيًا')}</span></div>`).join('')||'<div class="empty">لا توجد تسجيلات</div>'}</div></div>
 <div class="card"><h3>التشغيل التلقائي عبر Telegram</h3><div class="list"><div class="item">البوت يراقب مجموعة التفسير ويستقبل التسجيلات الصوتية.</div><div class="item">كل تسجيل يحفظ مع موضعه وترتيبه.</div><div class="item">عند تحديد ورد الطالب، يبحث الخادم عن التسجيل المطابق.</div><div class="item">إذا كان هناك أكثر من تسجيل، يرسلها بالترتيب دون تكرار.</div><div class="item">لا يتم وضع Bot Token داخل التطبيق.</div></div></div>`;
}

function saveAudio(){
 let a={id:id('audio'),name:val('aname'),source:val('asource'),chat:val('achat'),messageId:val('amsg'),from:+val('afrom')||null,to:+val('ato')||null,seq:+val('aseq')||1,type:val('atype'),file:val('afile'),sendMode:val('asend')||'يرسل تلقائيًا'};
 if(!a.name){toast('اكتب عنوان التسجيل');return}if(a.from&&a.to&&a.to<a.from){toast('نهاية الصفحات يجب أن تكون بعد البداية');return}state.audios.push(a);save();toast('تم حفظ التسجيل الصوتي');go('audio')
}
function showAudioQueue(){
 let s=state.students.find(x=>x.id==+val('a_student'));if(!s)return;
 let n=nextPage(s,'new'),end=n.to,start=n.from;
 let q=state.audios.filter(a=>a.from!=null&&a.to!=null&&a.to>=start&&a.from<=end).sort((a,b)=>(a.from||0)-(b.from||0)||(a.seq||0)-(b.seq||0));
 document.getElementById('audioQueue').innerHTML=`<div class="item"><b>${esc(s.name)}</b> — الورد الحالي: صفحة ${start} → ${end}<br>${q.length?q.map((a,i)=>`<div style="margin-top:8px"><span class="badge">${i+1}</span> ${esc(a.name)} — ${esc(a.type||'تفسير')} — ${esc(a.sendMode||'يرسل تلقائيًا')}</div>`).join(''):'لا يوجد تسجيل مطابق لهذا الورد بعد.'}<p class="small muted">عند ربط الخادم، يمكن إرسال هذه التسجيلات تلقائيًا إلى Telegram الطالب بالترتيب، مع حفظ آخر تسجيل تم إرساله لمنع التكرار.</p></div>`;
}

function telegram(){
 document.getElementById("app").innerHTML=`
 <div class="card"><h2>Telegram</h2><p>في النسخة التي تعمل مباشرة على الهاتف، لا يتم وضع Bot Token داخل الصفحة.</p>
 <p>الحالة: <b>${state.settings.telegramReady?"مفعل":"غير متصل — ينتظر الخادم السحابي"}</b></p>
 <p class="small muted">بعد إضافة الخادم: لكل حلقة جماعية Chat ID مستقل، والخادم يرسل منبهات المعلمة والمشرفة والطلاب حسب الجدول، ويمنع تكرار التذكير. كما يرسل إنذار الحذف بعد 3 غيابات شهرية، ويرسل التسجيلات الصوتية المتتابعة للطلاب حسب الورد، ويربط اختبارات Google بالموضع الحالي للطالب.</p></div>
 <div class="card"><h3>الحلقات الجماعية</h3>${state.circles.filter(c=>c.type==="جماعية").map(c=>`<div class="item"><b>${esc(c.name)}</b><br>Chat ID: ${esc(c.chat||"لم يضف بعد")}<br>رابط اللقاء: ${esc(c.link||"لم يضف بعد")}</div>`).join("")||'<div class="empty">لا توجد حلقات جماعية</div>'}</div>`;
}

function settings(){
 document.getElementById("app").innerHTML=`
 <div class="card"><h2>الإعدادات</h2><p>هذه النسخة مستقلة وتخزن البيانات محليًا داخل هذا المتصفح.</p><div class="list"><div class="item">الإشعارات: ${state.settings.notifications?'مفعلة على هذا الجهاز':'غير مفعلة'}</div><div class="item">مصدر اختبارات Google: ${esc(state.settings.googleSource||'غير محدد')}</div><div class="item">التسجيلات الصوتية التلقائية: ${state.settings.audioAutoSend!==false?'مفعلة عند ربط الخادم':'متوقفة'}</div></div>
 <div class="actions"><button onclick="exportData()">تصدير نسخة احتياطية</button><label><button onclick="document.getElementById('import').click()">استيراد نسخة</button></label><input id="import" type="file" accept=".json" hidden onchange="importData(event)"></div></div>
 <div class="card"><h3>المرحلة التالية</h3><p>الخادم السحابي + قاعدة البيانات + Telegram + المصحف الموثوق + المزامنة بين الأجهزة.</p>
 <button class="danger" onclick="clearAll()">مسح بيانات الهاتف</button></div>`;
}
function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="halaqat-backup.json";a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();toast("تم الاستيراد");go("home")}catch{toast("الملف غير صالح")}};r.readAsText(f)}
function clearAll(){if(confirm("سيتم حذف كل بيانات هذه النسخة من الهاتف. هل أنت متأكد؟")){state=blank();save();go("home");toast("تم المسح")}}
function resetDemo(){
 if(!confirm("إضافة بيانات تجريبية؟"))return;
 state=blank();
 let c={id:id("circle"),name:"حلقة النور",teacher:"المعلمة",type:"جماعية",chat:"",link:"https://zoom.us/",days:"الأحد والثلاثاء",time:"19:00",reminder:30,reminders:{teacher:30,supervisor:45,student:30},weekly:[{day:"sun",name:"الأحد",start:"19:00",end:"20:00"},{day:"tue",name:"الثلاثاء",start:"19:00",end:"20:00"}]};state.circles.push(c);
 let st={id:id("student"),name:"طالب تجريبي",number:"001",circleId:c.id,teacher:"المعلمة",companion:"",plan:"حفظ ومراجعة",portion:"نصف وجه",newP:"نصف وجه",repeatP:"وجه",masteryP:"ربع وجه",lastPage:10,telegram:"",phone:""};state.students.push(st);
 state.audios.push({id:id('audio'),name:'تفسير السعدي — نموذج 1',source:'مجموعة التفسير',chat:'',messageId:'',from:11,to:11,seq:1,type:'تفسير السعدي',file:''});
 state.googleTests.push({id:id('googleTest'),name:'اختبار الورد الحالي — نموذج',from:11,to:11,url:'https://forms.google.com/',type:'أسبوعي'});
 save();toast("تمت إضافة البيانات التجريبية");go("home")
}
function val(id){return document.getElementById(id)?.value||""}
nav();go("home");
</script>
